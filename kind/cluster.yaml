# Cluster Kubernetes local : un seul nœud kind (Kubernetes dans un conteneur Docker).
# Les interfaces web sont publiées en NodePort, et seulement sur 127.0.0.1.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dataops
nodes:
  - role: control-plane
    # Image du nœud épinglée (version par défaut de kind v0.33.0) : même Kubernetes en local et en CI.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080, listenAddress: "127.0.0.1" } # Airflow
      - { containerPort: 30088, hostPort: 30088, listenAddress: "127.0.0.1" } # Trino
      - { containerPort: 30030, hostPort: 30030, listenAddress: "127.0.0.1" } # Grafana
      - { containerPort: 30090, hostPort: 30090, listenAddress: "127.0.0.1" } # Prometheus
      - { containerPort: 30093, hostPort: 30093, listenAddress: "127.0.0.1" } # Alertmanager
      - { containerPort: 30091, hostPort: 30091, listenAddress: "127.0.0.1" } # OpenCost
      - { containerPort: 30901, hostPort: 30901, listenAddress: "127.0.0.1" } # Console MinIO
