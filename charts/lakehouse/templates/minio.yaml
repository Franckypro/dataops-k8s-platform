# MinIO : stockage objet compatible S3, un seul nœud, données sur un volume persistant.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.minio.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate # le volume ReadWriteOnce ne peut être monté que par un pod à la fois
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" . | nindent 8 }}
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: minio
          image: {{ include "lakehouse.image" .Values.minio.image }}
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: root-user }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: root-password }
            # Métriques Prometheus lisibles sans jeton (réseau interne du cluster uniquement)
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          # Délais tolérants : sur un poste chargé, une réponse peut prendre plusieurs secondes
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: console, port: 9001, targetPort: console, nodePort: {{ .Values.minio.consoleNodePort }} }
